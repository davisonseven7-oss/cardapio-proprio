<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garçom · Huntix</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="/static/huntix-mark.svg" type="image/svg+xml">
<style>
/* Página do garçom: link secreto, sem senha. Escolhe a mesa, lança os itens e manda para a cozinha. */
:root{--bg:#F5F6F7;--card:#fff;--ink:#1F2328;--muted:#5F6670;--line:#DADDE1;--ok:#1A7F37;--hx:#E8611A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1114;--card:#171A1E;--ink:#E6E8EB;--muted:#9298A0;--line:#2C3138;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1114;--card:#171A1E;--ink:#E6E8EB;--muted:#9298A0;--line:#2C3138;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;padding-bottom:90px}
.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) 12px 0}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header b{font-size:17px}header small{color:var(--muted);display:block;font-size:13px}
.back{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 10px;font:inherit;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mesa{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:14px 8px;text-align:center;font:inherit;font-weight:600}
.mesa small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.mesa.oc{border-color:#E8A15F;background:#FFF8F1}
input,select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;background:var(--card);color:var(--ink)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 12px;margin-bottom:6px;width:100%;font:inherit;text-align:left;color:var(--ink)}
.prod span{color:var(--muted);font-size:14px;white-space:nowrap}
.prod[disabled]{opacity:.45}
h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.sheet{position:fixed;inset:0;background:rgba(15,17,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.panel{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.op{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.op span{flex:1}.op em{font-style:normal;color:var(--muted);font-size:13px}
.btn{height:46px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:0 14px}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.foot b{flex:1;font-size:14px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln small{display:block;color:var(--muted);font-size:12px}
.rm{border:0;background:none;color:#CF222E;font:inherit;font-size:13px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:6px;align-items:center}.qty button{border:0;background:none;width:36px;height:36px;font-size:18px;color:var(--ink)}.qty b{min-width:24px;text-align:center}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;z-index:40;font-size:14px}
.err{color:#CF222E;font-size:14px;margin-top:8px}
.full{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"><div class="full">Carregando…</div></div>
<div class="foot" id="foot" hidden><div class="in"><b id="fb"></b><button class="btn" id="fver">Ver</button><button class="btn go" id="fenv">Enviar</button></div></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const TOKEN=location.pathname.split('/').filter(Boolean)[1];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const gOf=g=>({nome:g.nome,itens:g.itens||[],min:g.min??1,max:g.max??1,regra:g.regra||'soma'});
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,2400); }
let D=null, MESA=null, CART=[], Q='';
async function load(){ const r=await fetch('/api/g/'+TOKEN); if(!r.ok){ $('#app').innerHTML='<div class="full"><div><b style="color:var(--ink)">Link inválido</b><br>Peça um novo link no caixa.</div></div>'; return false; } D=await r.json(); return true; }
async function mesas(){ if(!await load()) return; MESA=null; CART=[]; foot();
  $('#app').innerHTML=`<header><div><b>Olá, ${esc(D.garcom.split(' ')[0])}</b><small>${esc(D.loja)} · escolha a mesa</small></div></header>
  <div class="grid">${D.mesas.map(m=>`<button class="mesa ${m.comanda?'oc':''}" data-m="${m.id}">${esc(m.nome)}<small>${m.comanda?BRL(m.comanda.total):'Livre'}</small></button>`).join('')||'<p>Nenhuma mesa cadastrada.</p>'}</div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>abrir(+b.dataset.m)); }
function abrir(id){ MESA=D.mesas.find(m=>m.id===id); CART=[]; Q=''; draw(); }
function draw(){ const c=MESA.comanda;
  const ps=D.prods.filter(p=>!Q||p.name.toLowerCase().includes(Q));
  $('#app').innerHTML=`<header><button class="back" id="bk">← Mesas</button><div><b>${esc(MESA.nome)}</b><small>${c?`Consumo: ${BRL(c.total)} · ${c.itens.reduce((a,i)=>a+i.qty,0)} item(ns)`:'Mesa livre'}</small></div></header>
  <div class="bar"><input type="search" id="q" placeholder="Buscar produto" value="${esc(Q)}"></div>
  ${D.cats.map(cat=>{ const its=ps.filter(p=>p.cat===cat.id); return its.length?`<h3>${esc(cat.name)}</h3>${its.map(p=>`<button class="prod" data-p="${p.id}" ${p.estoque!=null&&p.estoque<=0?'disabled':''}><b>${esc(p.name)}</b><span>${p.estoque!=null&&p.estoque<=0?'Esgotado':BRL(p.price)}</span></button>`).join('')}`:''; }).join('')}`;
  $('#bk').onclick=mesas; $('#q').oninput=e=>{ Q=e.target.value.toLowerCase(); const pos=e.target.selectionStart; draw(); const i=$('#q'); i.focus(); i.setSelectionRange(pos,pos); };
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>item(D.prods.find(p=>p.id===+b.dataset.p))); foot(); }
function item(p){ const G=(p.opts||[]).map(gOf); let q=1;
  $('#panel').innerHTML=`<b style="font-size:17px">${esc(p.name)}</b><div style="color:var(--muted)">${BRL(p.price)}</div>
    ${G.map((g,gi)=>{ const radio=g.max===1&&g.min===1; return `<h3>${esc(g.nome)} · ${g.max===1?(g.min?'escolha 1':'opcional'):`até ${g.max}`}</h3>${g.itens.map(([n,x],oi)=>`<label class="op"><input type="${radio?'radio':'checkbox'}" name="g${gi}" value="${oi}" ${radio&&!oi?'checked':''} style="width:20px;height:20px"><span>${esc(n)}</span><em>${+x?'+ '+BRL(+x):''}</em></label>`).join('')}`; }).join('')}
    <h3>Observação</h3><input type="text" id="obs" placeholder="Ex.: sem gelo">
    <div class="err" id="er"></div>
    <div style="display:flex;gap:8px;margin-top:14px;align-items:center"><div class="qty"><button id="m">−</button><b id="qv">1</b><button id="pl">+</button></div><button class="btn" id="cn" style="flex:1">Cancelar</button><button class="btn go" id="ok" style="flex:1.4">Adicionar</button></div>`;
  $('#sheet').hidden=false;
  const sel=()=>G.map((g,gi)=>[...document.querySelectorAll(`[name=g${gi}]:checked`)].map(x=>+x.value));
  $('#panel').onchange=()=>{ const s=sel(); G.forEach((g,gi)=>{ if(g.max>1||g.min===0) document.querySelectorAll(`[name=g${gi}]`).forEach(x=>{ if(!x.checked) x.disabled=s[gi].length>=g.max; }); }); };
  $('#m').onclick=()=>{ if(q>1) $('#qv').textContent=--q; }; $('#pl').onclick=()=>{ $('#qv').textContent=++q; };
  $('#cn').onclick=()=>$('#sheet').hidden=true;
  $('#ok').onclick=()=>{ const s=sel(), miss=G.findIndex((g,gi)=>s[gi].length<g.min); if(miss>=0) return $('#er').textContent=`Escolha em "${G[miss].nome}"`;
    const labels=G.map((g,gi)=>s[gi].length?`${g.nome}: ${s[gi].map(i=>g.itens[i][0]).join(', ')}`:'').filter(Boolean);
    CART.push({id:p.id,nome:p.name,qty:q,opts:s,obs:$('#obs').value.trim(),labels}); $('#sheet').hidden=true; toast(`${q}× ${p.name}`); foot(); }; }
function foot(){ const n=CART.reduce((a,i)=>a+i.qty,0); $('#foot').hidden=!MESA||!n; $('#fb').textContent=`${n} item(ns) para ${MESA?MESA.nome:''}`; }
$('#fver').onclick=()=>{ $('#panel').innerHTML=`<b style="font-size:17px">Para enviar · ${esc(MESA.nome)}</b>${CART.map((i,k)=>`<div class="ln"><div>${i.qty}× ${esc(i.nome)}${i.labels.length||i.obs?`<small>${esc([...i.labels,i.obs&&'Obs.: '+i.obs].filter(Boolean).join(' · '))}</small>`:''}</div><button class="rm" data-r="${k}">Remover</button></div>`).join('')}
  ${MESA.comanda&&MESA.comanda.itens.length?`<h3>Já lançado na mesa</h3>${MESA.comanda.itens.map(i=>`<div class="ln"><span>${i.qty}× ${esc(i.nome)}</span><span>${BRL(i.total)}</span></div>`).join('')}`:''}
  <div style="margin-top:14px"><button class="btn" id="fx" style="width:100%">Fechar</button></div>`; $('#sheet').hidden=false;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ CART.splice(+b.dataset.r,1); foot(); if(!CART.length) $('#sheet').hidden=true; else $('#fver').click(); });
  $('#fx').onclick=()=>$('#sheet').hidden=true; };
$('#fenv').onclick=async()=>{ const b=$('#fenv'); b.disabled=true;
  try{ const r=await fetch(`/api/g/${TOKEN}/mesas/${MESA.id}/itens`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({itens:CART.map(i=>({id:i.id,qty:i.qty,opts:i.opts,obs:i.obs}))})}); const j=await r.json(); if(!r.ok) throw new Error(j.erro);
    toast(`Enviado para a cozinha · ${MESA.nome}`); const id=MESA.id; await load(); abrir(id); }
  catch(e){ toast(e.message||'Não deu para enviar'); } b.disabled=false; };
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') $('#sheet').hidden=true; };
mesas();
</script>
</body>
</html>
