<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Huntix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap">
<link rel="stylesheet" href="/static/huntix.css">
<link rel="icon" href="/static/huntix-mark.svg" type="image/svg+xml">
<style>
/* menu lateral */
:root{--side:248px}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.sideTop{padding:16px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.store{display:flex;align-items:center;gap:10px;min-width:0;background:var(--soft);border-radius:12px;padding:8px 10px}
.store img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none}
.store b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.store small{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.tabs .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 4px}
.tabs button,.sl{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:600;color:var(--muted);text-align:left;text-decoration:none;font-size:14px;cursor:pointer}
.tabs button svg,.sl svg{width:20px;height:20px;flex:none}
.tabs button:hover,.sl:hover{background:var(--soft);color:var(--ink)}
.tabs button.on{background:var(--hx-soft);color:var(--hx)}
.tabs button span:not(.dot){flex:1}
.tabs .dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--hx);color:#fff;font-size:11px;font-weight:800;padding:0 6px}
.sideFoot{border-top:1px solid var(--line);padding:8px 10px 12px;display:grid;gap:2px}
.sl.app{color:var(--hx)}
.acting{background:var(--hx);color:#fff;font-weight:600;font-size:13px;text-align:center;padding:7px 12px;margin-left:var(--side)}
.acting a{color:#fff;font-weight:800}
main{margin-left:var(--side);max-width:calc(1180px + var(--side));padding:22px 28px 60px}
.menuBtn{display:none}
.sideBack{display:none}
@media (max-width:900px){
  .side{transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.menuOn .side{transform:none}
  body.menuOn .sideBack{display:block;position:fixed;inset:0;background:rgba(10,10,14,.45);z-index:25}
  .menuBtn{display:grid;place-items:center;position:fixed;top:10px;left:10px;z-index:20;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .menuBtn svg{width:22px;height:22px}
  .acting{margin-left:0;padding-left:60px}
  main{margin-left:0;padding:62px 14px 60px}
}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:20px;margin:0 auto 0 0}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--muted);font-weight:600;font-size:12px}
.kpi b{display:block;font-size:24px;margin-top:4px;font-family:var(--f-brand);letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:3px;height:180px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%;position:relative}
.chart .c i{display:block;width:100%;max-width:28px;background:var(--hx);border-radius:4px 4px 0 0;min-height:2px}
.chart .c:hover i{opacity:.8}
.chart .c span{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.chart .c .tip{position:absolute;bottom:100%;background:var(--ink);color:var(--bg);font-size:11px;padding:4px 6px;border-radius:6px;white-space:nowrap;display:none;z-index:2}
.chart .c:hover .tip{display:block}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.hbar .t{grid-column:1/-1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.hbar .t i{display:block;height:100%;background:var(--hx);border-radius:3px}
.funnel{display:grid;gap:8px}
.funnel div{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.funnel em{display:block;height:22px;background:var(--hx-soft);border-radius:6px;position:relative;overflow:hidden;font-style:normal}
.funnel em i{position:absolute;inset:0 auto 0 0;background:var(--hx);border-radius:6px}

.ptools{font-size:13px;gap:14px}
.tg{display:inline-flex;gap:6px;align-items:center;font-weight:500;color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--soft);border-radius:14px;padding:10px;min-height:300px;border:2px dashed transparent;transition:border-color .15s}
.col.over{border-color:var(--hx)}
.col header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 4px 10px}
.col header b{font-size:14px}
.col header .cnt{min-width:22px;height:22px;border-radius:11px;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.col[data-col=novo] header .cnt{background:var(--hx);color:#fff}
.col header small{width:100%;color:var(--muted);font-size:11px}
.col .cards{display:grid;gap:10px}
.col footer{font-size:12px;padding:8px 4px 0}
.col .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;margin:0}
.ord{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:grab}
.ord.drag{opacity:.4}
.ord.novo{border-color:var(--hx);box-shadow:0 0 0 3px var(--hx-soft);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--hx-soft)}}
.ord.cancelado{opacity:.6}
.ord .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ord .h b{font-size:17px}
.ord .tm{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ord .tm.late{color:var(--bad)}
.ord ul{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:2px}
.ord ul small{color:var(--muted)}
.ord .obs,.obs{font-size:12px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--ink);border-radius:8px;padding:6px 8px}
.ord .tt{display:flex;justify-content:space-between;font-weight:700;border-top:1px dashed var(--line);padding-top:8px}
.ord .acts{display:flex;gap:6px}
.ord .mini{display:flex;gap:12px;font-size:12px;border-top:1px solid var(--line);padding-top:8px}
.ord .mini button,.ord .mini a{background:none;border:0;padding:0;color:var(--muted);font-weight:600;text-decoration:none;cursor:pointer}
.ord .mini button:hover,.ord .mini a:hover{color:var(--hx)}
.steps{display:flex;gap:0;margin-top:14px}
.stp{flex:1;display:grid;justify-items:center;gap:6px;text-align:center;font-size:12px;color:var(--muted);position:relative}
.stp i{width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1}
.stp::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.done i,.stp.done::before{background:var(--ok)}
.stp.done{color:var(--ink);font-weight:600}
.stp.bad i{background:var(--bad)}
.stp small{display:block;font-weight:400;color:var(--muted)}

.cat{margin-bottom:18px}
.cat .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cat .ch h3{margin:0;font-size:16px}
.prods{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pr.off{opacity:.55}
.pr .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--hx-soft);color:var(--hx);display:grid;place-items:center}
.pr .th img{width:100%;height:100%;object-fit:cover}
.pr .th svg{width:30px;height:30px}
.pr b{display:block}
.pr small{color:var(--muted);font-size:12px}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:11px;background:var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{left:20px}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick .pv{width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--hx-soft);color:var(--hx);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.imgpick .pv svg{width:46px;height:46px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:4px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink);font-weight:500}
.slide{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:10px}
.hours{display:grid;grid-template-columns:110px 70px 1fr 1fr;gap:8px;align-items:center}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0}
.pc .im{aspect-ratio:4/5;background:var(--hx-soft);color:var(--hx);display:grid;place-items:center}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .im svg{width:40%;height:40%}
.pc div.t{padding:8px 10px;font-size:12px;color:var(--muted)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;word-break:break-all}
.help{font-size:12px;color:var(--muted);margin:4px 0 0}
.ent{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.ent:has(input:checked){border-color:var(--hx);background:var(--hx-soft)}
.ent b{display:block}.ent small{color:var(--muted);font-size:12px}
.ent-tag{font-size:12px;font-weight:700;margin-top:3px}
.appbanner{display:flex;align-items:center;gap:14px;background:#111;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;position:relative;flex-wrap:wrap}
.appbanner .ic{width:42px;height:42px;border-radius:10px;background:var(--hx);display:grid;place-items:center;font-size:22px;flex:none}
.appbanner b{display:block}.appbanner span{font-size:13px;color:#B7B9C4}
.appbanner>div:nth-child(2){flex:1;min-width:220px}
.appbtns{display:flex;gap:8px;flex-wrap:wrap}
.appbanner .x{position:absolute;top:6px;right:8px;background:none;border:0;color:#9A9DAA;font-size:20px;cursor:pointer}
.fidp{margin-top:10px;background:var(--hx-soft);border-radius:10px;padding:8px 12px;font-size:13px}

/* ===== visual sóbrio (sobrepõe o anterior) ===== */
.store{background:none;border-radius:0;padding:0}
.store img{width:32px;height:32px;border-radius:4px}
.sideTop{padding:14px 14px 12px;gap:14px}
.tabs{padding:6px 8px}
.tabs .grp{font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;padding:14px 10px 4px}
.tabs button,.sl{padding:7px 10px;border-radius:6px;font-weight:500;color:var(--ink);gap:10px}
.tabs button svg,.sl svg{width:18px;height:18px;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--hx)}
.tabs button.on svg{color:var(--ink)}
.tabs .dot{min-width:18px;height:18px;border-radius:9px;font-size:11px;font-weight:600}
.sl.app{color:var(--ink)}
.acting{background:#FFF8C5;color:#3D3A00;font-weight:500;border-bottom:1px solid #E7DC88}
.acting a{color:#3D3A00;font-weight:600}
.menuBtn{border-radius:6px!important;box-shadow:none!important}
.bar h1{font-size:18px;font-weight:600}
.seg{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px}
.seg button{border-radius:4px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--ink);box-shadow:none}
.kpi{border-radius:8px}
.kpi small{font-weight:500}
.kpi b{font-family:var(--f);font-size:22px;font-weight:600;letter-spacing:0}
.chart .c i{border-radius:2px 2px 0 0}
.hbar .t,.hbar .t i{border-radius:2px}
.funnel em{background:var(--soft);border-radius:3px}.funnel em i{border-radius:3px}
.col{background:var(--soft);border:1px solid var(--line);border-radius:8px}
.col.over{border:1px dashed var(--hx)}
.col header .cnt{border:1px solid var(--line);font-weight:600}
.ord{border-radius:6px;padding:11px}
.ord.novo{border-color:var(--line);box-shadow:inset 3px 0 0 var(--hx);animation:none}
.ord .h b{font-size:15px}
.ord .tm{font-weight:500}
.ord .obs,.obs{background:var(--soft);border-left:2px solid var(--warn);border-radius:0 4px 4px 0}
.ord .tt{font-weight:600;border-top-style:solid}
.ord .mini button,.ord .mini a{font-weight:500}
.ord .mini button:hover,.ord .mini a:hover{color:var(--ink);text-decoration:underline}
.pr{border-radius:6px}
.pr .th,.imgpick .pv,.pc .im{background:var(--soft);color:var(--muted)}
.pr .th{border-radius:4px}.imgpick .pv{border-radius:6px}
.pc,.slide,.linkbox,.ent,.days label{border-radius:6px}
.ent:has(input:checked){border-color:var(--hx);background:var(--card);box-shadow:0 0 0 1px var(--hx)}
.ent-tag{font-weight:500;color:var(--muted)}
.fidp{background:var(--soft);border-radius:6px}
.appbanner{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;gap:12px}
.appbanner span{color:var(--muted)}
.appbanner .x{color:var(--muted)}
.stp.done i,.stp.done::before{background:var(--ink)}
.ord .acts{justify-content:space-between;align-items:center}
/* ações do pedido: avançar em verde, recusar/cancelar em vermelho */
.ord .acts .btn:not(.danger),#mbox .btn#dn,#mbox .btn#ok.go{flex:0 0 auto!important;min-width:110px;background:#1A7F37;border-color:#1A7F37;color:#fff}
.ord .acts .btn:not(.danger):hover,#mbox .btn#dn:hover{background:#156B2E;border-color:#156B2E}
.ord .acts .btn.danger,#mbox .btn#dc{background:var(--card);border:1px solid #E5A3A8;color:var(--bad);padding:0 12px}
.ord .acts .btn.danger:hover,#mbox .btn#dc:hover{background:#FFF1F1;border-color:var(--bad)}
.ord .h .badge{margin-left:6px}
/* balcão e mesas */
.pdv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.pdv{grid-template-columns:1fr}}
.pbar{display:flex;gap:8px;margin-bottom:10px}.pbar input{flex:1}.pbar select{width:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:62vh;overflow:auto}
.pitem{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:10px;min-height:72px;cursor:pointer}
.pitem:hover{border-color:var(--ink)}
.pitem b{font-size:13px;font-weight:600;line-height:1.3}.pitem span{font-size:13px;color:var(--muted)}
.pitem.esg{opacity:.5;cursor:not-allowed}
.pright{position:sticky;top:12px}
.pl{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pl small{display:block;color:var(--muted);font-size:12px}
.qtyb{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qtyb button{border:0;background:none;width:28px;height:28px;font-size:16px;cursor:pointer}.qtyb b{min-width:22px;text-align:center}
.ptot{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:12px;font-size:15px}.ptot b{font-size:18px}
.btn.go{background:#1A7F37;border-color:#1A7F37;color:#fff}.btn.go:hover{background:#156B2E;border-color:#156B2E}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mesa{display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:12px;min-height:96px;cursor:pointer}
.mesa:hover{border-color:var(--ink)}
.mesa b{font-size:15px}.mesa small{color:var(--muted);font-size:12px}.mesa span{font-weight:600}
.mesa.oc{border-color:#E8A15F;background:#FFF8F1;box-shadow:inset 3px 0 0 var(--hx)}
.mesa em{font-style:normal;font-size:12px;color:var(--warn);font-weight:500}
/* tema sazonal */
.sl.tema b{font-weight:600}
.sl.tema.on{color:var(--hx)}.sl.tema.on svg{color:var(--hx)}
.tlist{display:grid;gap:8px}.tlist.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.tlist.two{grid-template-columns:1fr}}
.topt{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:400}
.topt:hover{border-color:var(--ink)}.topt.on{border-color:var(--hx);box-shadow:inset 0 0 0 1px var(--hx)}
.topt input{margin:0;accent-color:var(--hx)}
.topt b{display:block;font-size:14px}.topt small b{display:inline;font-size:inherit}.topt small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.topt .sw{display:inline-flex;padding:3px;border-radius:6px;border:1px solid var(--line);gap:2px}
.topt .sw i{width:12px;height:22px;border-radius:3px;display:block}
.tver{font-size:12px;color:var(--muted);text-decoration:underline}
.grp2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
</style>
</head>
<body>
<div id="acting" class="acting" hidden></div>
<button class="menuBtn" id="menuBtn" aria-label="Abrir menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="sideBack" id="sideBack"></div>
<aside class="side" id="side">
  <div class="sideTop">
    <a class="hx-logo" href="/painel" title="Huntix"><i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><g stroke="currentColor" stroke-width="2"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="6"/></g><circle cx="12" cy="12" r="2.6" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></i><span>HUNT<em>IX</em></span></a>
    <div class="store"><img id="sLogo" alt="" hidden><div style="min-width:0"><b id="sName">…</b><small id="sLink"></small></div></div>
  </div>
  <nav class="tabs" id="tabs">
    <div class="grp">Operação</div>
    <button data-tab="pedidos" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l1 18H5L6 3z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span>Pedidos</span><span class="dot" id="newDot" hidden>0</span></button>

<main id="main"></main>
<div id="modal" class="modal" hidden><div class="box" id="mbox"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="/static/icons.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DESK=window.huntixDesktop||null; /* presente quando o painel roda dentro do app Huntix Pedidos */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const ST={aberta:['Mesa aberta','warn'],pix:['Aguardando Pix','warn'],novo:['Novo','hx'],preparando:['Preparando','warn'],saiu:['Saiu p/ entrega','warn'],concluido:['Concluído','ok'],cancelado:['Cancelado','bad']};
const NEXT={novo:'preparando',preparando:'saiu',saiu:'concluido'};
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
async function api(url,method='GET',body){ const r=await fetch(url,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined}); if(r.status===401){ location.replace('/login'); throw new Error('login'); } const j=r.headers.get('content-type')?.includes('json')?await r.json():{}; if(!r.ok) throw new Error(j.erro||'Erro ao salvar'); return j; }
const today=()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays=(s,n)=>{ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmtH=x=>x==null?'':`${String(Math.floor(x)).padStart(2,'0')}:${String(Math.round(x%1*60)).padStart(2,'0')}`;
const parseH=s=>{ const m=String(s).match(/^(\d{1,2}):(\d{2})$/); return m?+m[1]+(+m[2])/60:null; };
const thumb=(img,icon)=>img?`<img src="${esc(img)}" alt="" loading="lazy">`:ico(icon||'bag');
function modal(html){ $('#mbox').innerHTML=html; $('#modal').hidden=false; $('#mbox').querySelector('input,select,textarea')?.focus(); }
function closeModal(){ $('#modal').hidden=true; }
$('#modal').addEventListener('mousedown',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#modal').hidden) closeModal(); });

/* foto: reduz no navegador e envia */
function pickImage(max=1080){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>{ const f=i.files[0]; if(!f) return res(null); const img=new Image(); img.onload=async()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
  try{ const j=await api('/api/p/upload','POST',{data:c.toDataURL('image/jpeg',.85)}); res(j.url); }catch(e){ toast(e.message); res(null); } }; img.onerror=()=>{ toast('Não consegui abrir essa imagem'); res(null); }; img.src=URL.createObjectURL(f); }; i.click(); }); }
function imgField(id,val,icon,label='Foto'){ return `<div class="f" style="display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--muted)">${label}<div class="imgpick"><div class="pv" id="${id}-pv">${thumb(val,icon)}</div><div style="display:grid;gap:6px"><input type="hidden" id="${id}" value="${esc(val||'')}"><div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn sec sm" data-up="${id}">Enviar foto</button><button type="button" class="btn ghost sm" data-clr="${id}">Remover</button></div><span class="h" style="font-weight:400">Sem foto, aparece o ícone.</span></div></div></div>`; }
document.addEventListener('click',async e=>{
  const u=e.target.closest('[data-up]'); if(u){ const id=u.dataset.up; u.disabled=true; u.textContent='Enviando…'; const url=await pickImage(); u.disabled=false; u.textContent='Enviar foto'; if(url){ $('#'+id).value=url; $('#'+id+'-pv').innerHTML=thumb(url); } return; }
  const c=e.target.closest('[data-clr]'); if(c){ const id=c.dataset.clr; $('#'+id).value=''; $('#'+id+'-pv').innerHTML=thumb('',$('#'+id+'-icon')?.value||'bag'); }
});
const iconSelect=(id,val)=>`<select id="${id}">${Object.keys(ICON_NAMES).map(k=>`<option value="${k}" ${k===val?'selected':''}>${ICON_NAMES[k]}</option>`).join('')}</select>`;

/* ---------------- sessão ---------------- */
let ME,LOJA,tab='pedidos';
(async()=>{
  try{ ME=await api('/api/me'); }catch{ return; }
  if(!ME.tenant){ if(ME.role==='admin') location.replace('/admin'); else document.body.innerHTML='<p style="padding:40px">Login sem loja vinculada. Fale com a Hunter Marketing.</p>'; return; }
  if(ME.role==='admin'){ $('#acting').hidden=false; $('#acting').innerHTML=`Você está no painel de <b>${esc(ME.tenant.name)}</b> como administrador · <a href="#" id="back">voltar ao admin</a>`; $('#back').onclick=async e=>{ e.preventDefault(); await api('/api/a/act','POST',{id:null}); location.href='/admin'; }; }
  await loadLoja(); const h=location.hash.slice(1); show($(`[data-tab="${h}"]`)?h:'pedidos'); pollNew(); setInterval(pollNew,20000);
})();
async function loadLoja(){ LOJA=await api('/api/p/loja'); temaLabel(); $('#sName').textContent=LOJA.name; const url=location.origin+'/'+LOJA.slug; $('#sLink').textContent=url.replace(/^https?:\/\//,'')+(LOJA.status==='pausado'?' · pausado':''); $('#ver').href='/'+LOJA.slug; const lg=$('#sLogo'); lg.hidden=!LOJA.settings.logo; lg.src=LOJA.settings.logo||''; document.title=LOJA.name+' · Huntix'; }
/* fora do app: mostra o botão de baixar (só faz sentido em computador) */
if(!DESK&&!/Android|iPhone|iPad/i.test(navigator.userAgent)) $('#getApp').hidden=false;
/* ---------------- tema sazonal do cardápio ---------------- */
function nomeTema(z){ return z.id==='blackfriday'?'Black '+(LOJA.settings.sigla||LOJA.marca):z.nome; }
function temaLabel(){
  const e=LOJA.settings.sazonal||'', z=LOJA.sazonais.find(x=>x.id===LOJA.sazonalAtual);
  $('#temaNome').textContent=!e?'Normal':e==='auto'?'do momento ('+(z?nomeTema(z):'—')+')':(z?nomeTema(z):'Normal');
  $('#temaBtn').classList.toggle('on',!!e);
}
function temaModal(){
  const e=LOJA.settings.sazonal||'', mes=LOJA.sazonais.find(x=>x.id===LOJA.sazonalDoMes), T=LOJA.settings.tema||{};
  const sw=(a,b,c,dk)=>`<span class="sw"${dk?' style="background:#000"':''}><i style="background:${a}"></i><i style="background:${b}"></i><i style="background:${c}"></i></span>`;
  const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const op=(id,nome,sub,cores,ver)=>`<label class="topt${e===id?' on':''}"><input type="radio" name="saz" value="${id}"${e===id?' checked':''}>${cores}<span><b>${nome}</b><small>${sub}</small></span><a href="/${LOJA.slug}?saz=${ver}" target="_blank" rel="noopener" class="tver">Ver</a></label>`;
  modal(`<h2>Tema do cardápio</h2><p class="muted" style="margin-top:-8px">Escolha manter o seu design ou usar o visual da época. A troca vale na hora para todos os clientes.</p>
  <div class="tlist">
    ${op('','Manter o design normal','As cores da sua loja, como sempre.',sw(T.cor||'#333',T.destaque||'#ccc',T.acento||'#eee'),'normal')}
    ${op('auto','Tema do momento (automático)',`Agora: <b>${mes?nomeTema(mes):'—'}</b>. Muda sozinho todo mês: Black Friday em novembro, Natal em dezembro, São João em junho…`,mes?(mes.id==='blackfriday'?sw(T.cor||'#333',T.destaque||'#ccc','#000',true):sw(mes.cor,mes.destaque,mes.acento)):'','auto')}
  </div>
  <label class="f" style="margin-top:14px">Nome da loja no tema<input id="tSigla" maxlength="18" value="${esc(LOJA.settings.sigla||'')}" placeholder="${esc(LOJA.marca)}"></label>
  <p class="help" style="margin-top:4px">Aparece no tema: <b id="tEx">BLACK ${esc((LOJA.settings.sigla||LOJA.marca).toUpperCase())}</b>, Natal ${esc(LOJA.settings.sigla||LOJA.marca)}… As cores e o logo continuam os da sua loja.</p>
  <div class="grp2">Ou escolha um tema fixo</div>
  <div class="tlist two">${LOJA.sazonais.map(z=>op(z.id,z.id==='blackfriday'?'Black '+esc(LOJA.settings.sigla||LOJA.marca):z.nome,MES[z.mes-1]+(z.id===LOJA.sazonalDoMes?' · <b>época atual</b>':''),(z.id==='blackfriday'?sw(T.cor||'#333',T.destaque||'#ccc','#000',true):sw(z.cor,z.destaque,z.acento)),z.id)).join('')}</div>
  <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn sec" id="tCancel">Cancelar</button><button class="btn" id="tSave">Salvar tema</button></div>`);
  $('#mbox').querySelectorAll('input[name=saz]').forEach(r=>r.onchange=()=>$('#mbox').querySelectorAll('.topt').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked)));
  $('#tCancel').onclick=()=>$('#modal').hidden=true;
  $('#tSigla').oninput=e=>$('#tEx').textContent='BLACK '+(e.target.value.trim()||LOJA.marca).toUpperCase();
  $('#tSave').onclick=async()=>{ const v=$('#mbox').querySelector('input[name=saz]:checked')?.value||'';
    try{ await api('/api/p/loja','PUT',{name:LOJA.name,settings:{sazonal:v,sigla:$('#tSigla').value.trim()}}); $('#modal').hidden=true; await loadLoja();
      toast(v?'Tema '+$('#temaNome').textContent+' ativado no cardápio':'Design normal de volta no cardápio'); }catch(err){ toast(err.message); } };
}
$('#temaBtn').onclick=temaModal;
$('#sair').onclick=async()=>{ await fetch('/api/logout',{method:'POST'}); location.replace('/login'); };
$('#tabs').onclick=e=>{ const b=e.target.closest('[data-tab]'); if(b){ show(b.dataset.tab); document.body.classList.remove('menuOn'); } };
$('#menuBtn').onclick=()=>document.body.classList.toggle('menuOn'); $('#sideBack').onclick=()=>document.body.classList.remove('menuOn');
function show(t){ tab=t; location.hash=t; $$('#tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); $('#main').innerHTML='<p class="muted">Carregando…</p>'; ({pedidos,clientes:clientesTab,entregadores,marketing,balcao,mesas:mesasTab,caixa:caixaTab,estoque:estoqueTab,relatorios,cardapio,stories,feed,loja,pixel,conta})[t]().catch(e=>{ $('#main').innerHTML=`<p class="err">${esc(e.message)}</p>`; }); }
let lastNew=null;
async function pollNew(){ try{ const j=await api('/api/p/orders/novos'); $('#newDot').hidden=!j.n; $('#newDot').textContent=j.n; document.title=(j.n?`(${j.n}) `:'')+LOJA.name+' · Huntix';
  if(lastNew!==null&&j.ultimo&&j.ultimo>lastNew){ toast('Pedido novo!'); beep(); const prev=lastNew; if(DESK) DESK.notify('Pedido novo · '+LOJA.name, j.n>1?`${j.n} pedidos esperando`:'Toque para abrir o painel');
    if(pref('imprimirNovo',false)){ try{ const ns=(await api('/api/p/orders?ativos=1')).filter(o=>o.id>prev&&o.status==='novo').sort((x,y)=>x.id-y.id); for(const o of ns){ printOrder(o); await new Promise(r=>setTimeout(r,1500)); } }catch{} }
    if(tab==='pedidos') pedidos(); } lastNew=j.ultimo||0; }catch{} }
function beep(){ try{ const a=new AudioContext(),o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=.08; o.start(); o.stop(a.currentTime+.25); }catch{} }

/* ---------------- pedidos (estilo Anota AI: colunas por etapa) ---------------- */
const PIXCOL=['pix','Aguardando Pix','Confira o Pix e confirme'];
const COLS=[['novo','Em análise','Aceite ou recuse'],['preparando','Em preparo','Na cozinha / separação'],['saiu','Saiu / Pronto','A caminho ou aguardando retirada'],['concluido','Concluídos','Hoje']];
const pref=(k,d)=>{ try{ const v=localStorage.getItem('hx-'+k); return v===null?d:v==='1'; }catch{ return d; } };
const setPref=(k,v)=>{ try{ localStorage.setItem('hx-'+k,v?'1':'0'); }catch{} };
let OV={view:'kanban',q:'',tipo:'',de:today(),ate:today(),status:''}, ORD=[], alarm=null;
const isRet=o=>o.bairro==='Retirada na loja';
const stLabel=o=>o.status==='saiu'?(isRet(o)?'Pronto p/ retirada':'Saiu p/ entrega'):ST[o.status][0];
const mins=o=>Math.floor((Date.now()-new Date(o.created_at))/6e4);
const elapsed=o=>{ const m=mins(o); return m<60?`${m} min`:`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`; };
const hhmm=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const nextOf=o=>({pix:['preparando','Confirmar Pix'],novo:['preparando','Aceitar'],preparando:['saiu',isRet(o)?'Pronto p/ retirada':'Saiu p/ entrega'],saiu:['concluido',isRet(o)?'Retirado':'Entregue']})[o.status];

async function pedidos(){
  const q=OV.view==='kanban'?new URLSearchParams({de:today(),ate:today(),ativos:1}):new URLSearchParams({de:OV.de,ate:OV.ate,...(OV.status?{status:OV.status}:{})});
  ORD=await api('/api/p/orders?'+q);
  const s=LOJA.settings, avisar=pref('avisar',true), som=pref('som',true);
  $('#main').innerHTML=`<div class="bar"><h1>Pedidos</h1>
    <div class="seg" id="ovw"><button data-v="kanban" class="${OV.view==='kanban'?'on':''}">Quadro</button><button data-v="lista" class="${OV.view==='lista'?'on':''}">Histórico</button></div>
    <input type="text" id="oq" placeholder="Buscar nº, nome ou telefone" value="${esc(OV.q)}" style="width:210px">
    <select id="otp" style="width:auto"><option value="">Entrega e retirada</option><option value="e" ${OV.tipo==='e'?'selected':''}>Só entrega</option><option value="r" ${OV.tipo==='r'?'selected':''}>Só retirada</option></select></div>
  <div class="bar ptools">
    <label class="tg"><input type="checkbox" id="pAv" ${avisar?'checked':''}> Avisar o cliente no WhatsApp ao mudar o status</label>
    <label class="tg"><input type="checkbox" id="pSom" ${som?'checked':''}> Alarme de pedido novo</label>

  $('#main').innerHTML=`<div class="bar"><h1>Balcão</h1><span class="muted">Caixa aberto · ${c.resumo.vendas} venda(s) · ${BRL(c.resumo.total)}</span></div>
  <div class="pdv"><div class="card pleft" id="pgrade"></div>
    <div class="card pright"><h2>Venda</h2><div id="pcart"></div>
      <div class="row" style="margin-top:10px"><div class="row cols2"><label class="f">Cliente (opcional)<input type="text" id="pnome" placeholder="Nome"></label><label class="f">WhatsApp (opcional)<input type="tel" id="pfone" placeholder="84999999999"></label></div>
      <label class="f">Desconto (R$)<input type="number" min="0" step="0.01" id="pdesc" placeholder="0,00"></label>
      <div><div style="font-size:13px;font-weight:500;margin-bottom:4px">Pagamento</div><div class="seg" id="ppag">${PAGS.map(x=>`<button data-p="${x}" class="${x===PDV.pag?'on':''}">${x}</button>`).join('')}</div></div>
      <label class="f" id="precF">Valor recebido (R$)<input type="number" min="0" step="0.01" id="prec"></label></div>
      <div class="ptot" id="ptot"></div><div class="err" id="perr"></div>
      <div class="foot" style="margin-top:10px"><button class="btn sec" id="plimpa">Limpar</button><button class="btn go" id="pfin" style="flex:1">Finalizar venda</button></div></div></div>`;
  gradeProdutos($('#pgrade'),(p,qty,sel,obs)=>{ const key=p.id+'|'+JSON.stringify(sel)+'|'+obs; const ex=PDV.itens.find(i=>i.key===key); if(ex) ex.qty+=qty; else PDV.itens.push({key,id:p.id,nome:p.name,price:p.price+extraOf(p,sel),qty,sel,obs,labels:labelsOf(p,sel)}); drawCart(); });
  const total=()=>{ const s=PDV.itens.reduce((a,i)=>a+i.price*i.qty,0); return Math.max(0,s-(+$('#pdesc').value||0)); };
  const drawCart=()=>{ $('#pcart').innerHTML=PDV.itens.length?PDV.itens.map((i,k)=>`<div class="pl"><div><b>${esc(i.nome)}</b>${i.labels.length||i.obs?`<small>${esc([...i.labels,i.obs&&'Obs.: '+i.obs].filter(Boolean).join(' · '))}</small>`:''}</div><div class="qtyb"><button data-m="${k}">−</button><b>${i.qty}</b><button data-p="${k}">+</button></div><span class="num">${BRL(i.price*i.qty)}</span></div>`).join(''):'<p class="muted">Clique nos produtos para adicionar.</p>';
    const t=total(), rec=+$('#prec').value||0; $('#precF').hidden=PDV.pag!=='Dinheiro';
    $('#ptot').innerHTML=`<span>Total</span><b class="num">${BRL(t)}</b>${PDV.pag==='Dinheiro'&&rec>=t&&t>0?`<span>Troco</span><b class="num" style="color:var(--ok)">${BRL(rec-t)}</b>`:''}`; };
  $('#pcart').onclick=e=>{ const m=e.target.closest('[data-m]'), p=e.target.closest('[data-p]'); if(m){ const i=PDV.itens[+m.dataset.m]; i.qty--; if(i.qty<1) PDV.itens.splice(+m.dataset.m,1); } if(p) PDV.itens[+p.dataset.p].qty++; drawCart(); };
  $('#ppag').onclick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; PDV.pag=b.dataset.p; $$('#ppag button').forEach(x=>x.classList.toggle('on',x===b)); drawCart(); };
  $('#pdesc').oninput=drawCart; $('#prec').oninput=drawCart;
  $('#plimpa').onclick=()=>{ PDV.itens=[]; drawCart(); };
  $('#pfin').onclick=async()=>{ if(!PDV.itens.length) return $('#perr').textContent='Adicione pelo menos um produto';
    const t=total(); if(PDV.pag==='Dinheiro'&&$('#prec').value&&+$('#prec').value<t) return $('#perr').textContent='Valor recebido menor que o total';
    try{ const j=await api('/api/p/pdv/venda','POST',{itens:PDV.itens.map(i=>({id:i.id,qty:i.qty,opts:i.sel,obs:i.obs})),pagamento:PDV.pag,recebido:+$('#prec').value||0,desconto:+$('#pdesc').value||0,nome:$('#pnome').value,telefone:$('#pfone').value});
      toast(`Venda #${j.num} · ${BRL(j.total)}${j.troco?` · troco ${BRL(j.troco)}`:''}`);
      if(pref('imprimirBalcao',true)){ const o=(await api('/api/p/orders?de='+today()+'&ate='+today())).find(x=>x.id===j.id); if(o) printOrder(o); }
      PDV.itens=[]; balcao(); }catch(e){ $('#perr').textContent=e.message; } };
  drawCart();
}

let CATS=[],PRODS=[],BRANDS=[];
const optsToText=o=>(o||[]).map(g=>{ const mn=g.min??1, mx=g.max??1, rg=g.regra||'soma', tag=mn===1&&mx===1&&rg==='soma'?'':` [${mn}-${mx}${rg!=='soma'?', '+rg:''}]`; return `${g.nome}${tag}: ${g.itens.map(([n,x])=>n+(+x?` +${String(x).replace('.',',')}`:'')).join(', ')}`; }).join('\n');
const textToOpts=t=>t.split('\n').map(l=>l.trim()).filter(l=>l.includes(':')).map(l=>{ const [cab,...r]=l.split(':'); const m=cab.match(/^(.*?)\s*\[\s*(\d+)\s*-\s*(\d+)\s*(?:,\s*(soma|maior|m[eé]dia))?\s*\]\s*$/i); const nome=(m?m[1]:cab).trim(), mn=m?+m[2]:1, mx=m?Math.max(1,+m[3]):1, rg=m&&m[4]?m[4].toLowerCase().replace('é','e'):'soma'; return {nome,min:Math.min(mn,mx),max:mx,regra:rg,itens:r.join(':').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{ const m=s.match(/^(.*?)\s*\+\s*(\d+(?:[.,]\d+)?)$/); return m?[m[1],+m[2].replace(',','.')]:[s,0]; })}; }).filter(g=>g.nome&&g.itens.length);

      <div class="prods">${PRODS.filter(p=>p.category_id===c.id).map(prow).join('')||'<p class="muted">Nenhum produto.</p>'}</div></div>`).join('')}
    ${sem.length?`<div class="cat"><div class="ch"><h3>Sem categoria</h3></div><div class="prods">${sem.map(prow).join('')}</div></div>`:''}

  const sync=()=>{ slides.forEach((x,i)=>{ x.img=$('#si'+i).value; x.icon=$('#si'+i+'-icon').value; }); $$('#sl [data-k]').forEach(el=>{ const x=slides[+el.dataset.i]; x[el.dataset.k]=el.dataset.k==='prod'?(el.value?+el.value:null):el.value; }); };

    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sa" ${s.active!==0?'checked':''}> Mostrar no cardápio</label></div>
    <div id="sl"></div><div class="err" id="me"></div>
    <div class="foot">${s.id?'<button class="btn danger" id="del">Excluir</button>':''}<button class="btn sec" id="add">+ Tela</button><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="ok">Salvar</button></div>`);
  draw();
  $('#add').onclick=()=>{ sync(); slides.push({t:'',p:''}); draw(); };
  $('#ok').onclick=async()=>{ sync(); const b={name:$('#sn').value.trim(),sort:+$('#so').value||0,active:$('#sa').checked,cover:$('#sc').value||'icon:'+$('#sc-icon').value,slides:slides.map(x=>({...(x.img?{img:x.img}:{icon:x.icon}),t:x.t,p:x.p,...(x.prod?{prod:x.prod}:{})}))};
    if(!b.name) return $('#me').textContent='Coloque o nome'; if(!b.slides.length) return $('#me').textContent='Adicione pelo menos uma tela';
    try{ await api('/api/p/stories'+(s.id?'/'+s.id:''),s.id?'PUT':'POST',b); closeModal(); toast('Destaque salvo'); stories(); }catch(e){ $('#me').textContent=e.message; } };
  $('#del')&&($('#del').onclick=async()=>{ if(!confirm('Excluir este destaque?')) return; await api('/api/p/stories/'+s.id,'DELETE'); closeModal(); stories(); });
}

/* ---------------- feed ---------------- */
async function feed(){
  const [list,prods]=await Promise.all([api('/api/p/posts'),api('/api/p/products')]); PRODS=prods;
  const pi=id=>PRODS.find(p=>p.id===id);
  $('#main').innerHTML=`<div class="bar"><h1>Feed</h1><button class="btn sm" id="np">+ Post</button></div>
    <p class="help" style="margin:-6px 0 14px">Posts estilo Instagram na aba Feed do cardápio. Ligue um produto para aparecer o preço e o botão de sacola. Sem nenhum post, o feed mostra os produtos sozinho.</p>
    <div class="posts">${list.map(x=>{ const p=pi(x.product_id); return `<button class="pc" data-ep="${x.id}" style="${x.active?'':'opacity:.5'}"><div class="im">${x.img?`<img src="${esc(x.img)}" alt="">`:p?thumb(p.img,p.icon):ico('bag')}</div><div class="t">${esc((x.caption||'').slice(0,70))}${p?`<br><b style="color:var(--ink)">${esc(p.name)}</b>`:''}</div></button>`; }).join('')||'<div class="card muted">Nenhum post ainda.</div>'}</div>`;
  $('#np').onclick=()=>editPost({});
  $$('[data-ep]').forEach(b=>b.onclick=()=>editPost(list.find(x=>x.id===+b.dataset.ep)));
}
function editPost(x){
  modal(`<h2>${x.id?'Editar post':'Novo post'}</h2><div class="row">${imgField('xi',x.img,'bag','Foto do post')}
    <label class="f">Produto<select id="xp"><option value="">Nenhum</option>${PRODS.map(p=>`<option value="${p.id}" ${p.id===x.product_id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="h">Sem foto, o post usa a foto (ou o ícone) do produto.</span></label>
    <label class="f">Legenda<textarea id="xc">${esc(x.caption||'')}</textarea></label>
    <label class="f">Texto grande sobre a foto (opcional)<input type="text" id="xo" value="${esc(x.overlay||'')}" maxlength="40"></label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="xa" ${x.active!==0?'checked':''}> Mostrar no feed</label></div><div class="err" id="me"></div>
    <div class="foot">${x.id?'<button class="btn danger" id="del">Excluir</button>':''}<button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn" id="ok">${x.id?'Salvar':'Publicar'}</button></div>`);
  $('#ok').onclick=async()=>{ const b={img:$('#xi').value,product_id:$('#xp').value,caption:$('#xc').value.trim(),overlay:$('#xo').value.trim(),active:$('#xa').checked};
    if(!b.img&&!b.product_id) return $('#me').textContent='Coloque uma foto ou escolha um produto';
    try{ await api('/api/p/posts'+(x.id?'/'+x.id:''),x.id?'PUT':'POST',b); closeModal(); toast('Post salvo'); feed(); }catch(e){ $('#me').textContent=e.message; } };
  $('#del')&&($('#del').onclick=async()=>{ if(!confirm('Excluir este post?')) return; await api('/api/p/posts/'+x.id,'DELETE'); closeModal(); feed(); });
}

/* ---------------- loja ---------------- */
const FONTES=['Shrikhand','Archivo Black','Rye','Bebas Neue','Pacifico','Lobster','Playfair Display','Fredoka'];
async function loja(){
  await loadLoja(); const s=LOJA.settings, T=s.tema;
  $('#main').innerHTML=`<div class="bar"><h1>Loja</h1><button class="btn" id="save">Salvar alterações</button></div><div class="grid">
  <div class="card"><h2>Dados</h2><div class="row"><div class="row cols2"><label class="f">Nome da loja<input type="text" id="ln" value="${esc(LOJA.name)}"></label><label class="f">Frase embaixo do nome<input type="text" id="lsub" value="${esc(s.subtitulo)}" placeholder="Ex.: Água de coco · Natal/RN"></label></div>
    <div class="row cols2"><label class="f">Cidade<input type="text" id="lci" value="${esc(s.cidade)}"></label><label class="f">Link do cardápio<div class="linkbox"><span id="lk">${esc(location.origin+'/'+LOJA.slug)}</span><button class="btn sec sm" id="cplk" type="button">Copiar</button></div><span class="h">Para trocar o endereço, fale com a Hunter Marketing.</span></label></div>
    <div class="row cols2"><label class="f">Endereço da loja (sai na comanda)<input type="text" id="lend" value="${esc(s.endereco||'')}" placeholder="Rua, número, bairro"></label><label class="f">Telefone da loja<input type="text" id="ltel" value="${esc(s.telefone||'')}"></label></div>
    ${imgField('llogo',s.logo,'bag','Logo (aparece redonda)')}</div></div>
  <div class="card"><h2>Visual</h2><div class="row cols3"><label class="f">Cor principal<input type="color" id="tc" value="${esc(T.cor)}" style="height:40px;padding:2px"></label><label class="f">Cor de destaque (preços)<input type="color" id="td" value="${esc(T.destaque)}" style="height:40px;padding:2px"></label><label class="f">Cor de acento<input type="color" id="ta" value="${esc(T.acento)}" style="height:40px;padding:2px"></label></div>
    <label class="f" style="margin-top:12px">Fonte do nome e dos títulos<select id="tf">${FONTES.map(f=>`<option ${f===T.fonte?'selected':''}>${f}</option>`).join('')}</select></label></div>
  <div class="card"><h2>Pedidos no WhatsApp</h2><div class="row"><div class="row cols2"><label class="f">WhatsApp que recebe os pedidos<input type="tel" id="lw" value="${esc(s.whatsapp)}" placeholder="5584999999999"><span class="h">Com 55 + DDD, só números.</span></label><label class="f">Horário do atendente humano<input type="text" id="lat" value="${esc(s.atendente)}" placeholder="Ex.: das 8h às 18h"></label></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lew" ${s.enviarWhats?'checked':''}> Abrir o WhatsApp da loja com o pedido escrito quando o cliente finalizar</label>
    <p class="help">O pedido sempre fica salvo aqui na aba Pedidos, com ou sem essa opção.</p></div></div>
  <div class="card"><h2>Tempo estimado</h2><div class="row cols2"><label class="f">Preparo (minutos)<input type="number" min="0" id="ltp" value="${s.tempoPreparo||30}"></label><label class="f">Entrega (minutos)<input type="number" min="0" id="lte" value="${s.tempoEntrega||40}"></label></div><p class="help">Aparece para o cliente na página de acompanhamento e deixa o pedido vermelho no painel quando passar do tempo.</p></div>
  <div class="card"><h2>Mensagens de status no WhatsApp</h2><p class="help" style="margin-top:-6px">Enviadas ao cliente quando você move o pedido. Pode usar: {nome} {pedido} {loja} {total} {pagamento} {link} (acompanhamento) {cardapio}.</p><div class="row" style="margin-top:8px">
    ${[['pixConfirmado','Pix confirmado'],['preparando','Aceito / em preparo'],['saiu','Saiu para entrega'],['pronto','Pronto para retirada'],['concluido','Entregue'],['cancelado','Cancelado']].map(([k,n])=>`<label class="f">${n}<textarea data-msg="${k}" style="min-height:64px">${esc(s.mensagens[k]||'')}</textarea></label>`).join('')}</div></div>
  <div class="card"><h2>Horário de funcionamento</h2><div class="row">${DIAS.map((d,i)=>{ const h=s.horario[i]; return `<div class="hours"><b style="font-size:13px">${d}</b><label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" data-hd="${i}" ${h?'checked':''}>aberto</label><input type="time" data-ha="${i}" value="${fmtH(h?h[0]:8)}"><input type="time" data-hb="${i}" value="${fmtH(h?h[1]:18)}"></div>`; }).join('')}</div></div>
  <div class="card"><h2>Entrega</h2><div class="row">
    <div class="seg" id="emodo">${[['bairro','Taxa por bairro'],['distancia','Taxa por distância (CEP)']].map(([k,n])=>`<button type="button" data-em="${k}" class="${(s.entrega.modo||'bairro')===k?'on':''}">${n}</button>`).join('')}</div>
    <div id="edist" ${s.entrega.modo==='distancia'?'':'hidden'} class="row">
      <div class="row cols3"><label class="f">CEP da loja<input type="text" id="lcep" placeholder="00000-000" inputmode="numeric"></label><label class="f">Número<input type="text" id="lnum" placeholder="123"></label><label class="f" style="align-self:end"><button type="button" class="btn sec" id="lloc">Localizar no mapa</button></label></div>
      <div class="row cols2"><label class="f">Latitude<input type="text" id="llat" value="${s.lojaLat??''}"></label><label class="f">Longitude<input type="text" id="llng" value="${s.lojaLng??''}"></label></div>
      <div id="lmap" class="help">${s.lojaLat?`Localização salva · <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${s.lojaLat}&mlon=${s.lojaLng}#map=17/${s.lojaLat}/${s.lojaLng}">conferir no mapa</a>`:'A loja ainda não foi localizada.'}</div>
      <label class="f">Faixas de distância (uma por linha)<textarea id="lfx" style="min-height:110px" placeholder="3; 5&#10;6; 8&#10;10; 12">${esc((s.entrega.faixas||[]).map(([k,t])=>`${String(k).replace('.',',')}; ${String(t).replace('.',',')}`).join('\n'))}</textarea><span class="h">Formato: <b>até km; taxa</b>. Ex.: "3; 5" = até 3 km, R$ 5.</span></label>
      <div class="row cols2"><label class="f">Distância máxima (km)<input type="number" min="0" step="0.5" id="lrm" value="${s.entrega.raioMax||''}"></label><label class="f">Ajuste de rota (×)<input type="number" min="1" max="2" step="0.05" id="lft" value="${s.entrega.fator||1.3}"><span class="h">A distância é em linha reta; 1,3 aproxima o caminho pelas ruas.</span></label></div>
      <p class="help">O cliente digita o CEP, o endereço é preenchido sozinho e a taxa é calculada pela distância até a loja. Se o endereço não for achado no mapa, vale a taxa do bairro (lista abaixo).</p>
    </div>
    <label class="f">Bairros e taxas (um por linha)<textarea id="lb" style="min-height:140px" placeholder="Centro; 6&#10;Nova Parnamirim; 10">${esc(s.bairros.map(([b,t])=>`${b}; ${String(t).replace('.',',')}`).join('\n'))}</textarea><span class="h">Formato: Bairro; taxa</span></label>
    <div class="row cols2"><label class="f">Pedido mínimo para entrega (R$)<input type="number" step="0.01" min="0" id="lm" value="${s.minimo||''}"></label><label class="f">Formas de pagamento (na entrega/retirada)<input type="text" id="lpg" value="${esc(s.pagamentos.join(', '))}"><span class="h">Separadas por vírgula. Ex.: Pix na entrega, Cartão (maquininha), Dinheiro</span></label></div>
    <div class="row cols2"><label class="f">Chave Pix da loja (opcional)<input type="text" id="lpx" value="${esc(s.pixChave||'')}" placeholder="CNPJ, telefone, e-mail ou chave aleatória"><span class="h">Aparece para quem escolher Pix, para adiantar o pagamento se quiser.</span></label><label class="f">Nome do titular da chave<input type="text" id="lpn" value="${esc(s.pixNome||'')}" placeholder="Ex.: Potengi Rações LTDA"></label></div>
    <p class="help">O sistema não cobra nada online: o cliente paga na entrega ou na retirada. Pagamento online (Mercado Pago, Asaas) pode ser ligado depois.</p>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lr" ${s.retirada?'checked':''}> Permitir retirada na loja (sem taxa)</label>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lpa" ${s.pixAntecipado?'checked':''}> Aceitar <b>Pix antecipado</b>: o cliente paga pela chave acima e o pedido só vai para a cozinha quando você confirmar o pagamento</label></div></div>
  <div class="card"><h2>Promoção do dia</h2><p class="help" style="margin-top:-6px">O tema aparece no story <b>Hoje</b>. Os preços de cada dia ficam no próprio produto (aba Cardápio).</p><div class="row cols2" style="margin-top:8px">${DIAS.map((d,i)=>`<label class="f">${d}<input type="text" data-pt="${i}" value="${esc(s.promoTemas[i]||'')}"></label>`).join('')}</div></div>
  <div class="card"><h2>Curtidas</h2><div class="row cols3"><label class="f">Curtidas para ganhar desconto<input type="number" min="0" id="cm" value="${s.curtidas.meta}"><span class="h">0 desliga.</span></label><label class="f">Desconto por curtir (%)<input type="number" min="0" max="50" id="cd" value="${s.curtidas.desconto}"></label><label class="f">Desconto do campeão da semana (%)<input type="number" min="0" max="80" id="cc" value="${s.curtidas.campeao}"></label></div></div>
  <div class="card"><h2>Robô do direct</h2><div class="row cols2"><label class="f">Nome do robô<input type="text" id="rn" value="${esc(s.robo.nome)}"></label><label style="display:flex;gap:8px;align-items:center;align-self:end;height:40px"><input type="checkbox" id="ra" ${s.robo.ativo?'checked':''}> Mostrar o direct com o robô</label></div></div>
  </div>`;
  $('#cplk').onclick=()=>navigator.clipboard.writeText($('#lk').textContent).then(()=>toast('Link copiado'));
  let EMODO=s.entrega.modo||'bairro';
  $('#emodo').onclick=e=>{ const b=e.target.closest('[data-em]'); if(!b) return; EMODO=b.dataset.em; $$('#emodo button').forEach(x=>x.classList.toggle('on',x===b)); $('#edist').hidden=EMODO!=='distancia'; };
  $('#lloc').onclick=async()=>{ const bt=$('#lloc'); bt.disabled=true; bt.textContent='Procurando…';
    try{ const j=await api('/api/p/localizar','POST',{cep:$('#lcep').value,numero:$('#lnum').value}); $('#llat').value=j.lat.toFixed(6); $('#llng').value=j.lng.toFixed(6);
      $('#lmap').innerHTML=`Achei: ${esc(j.endereco||'')} · <a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${j.lat}&mlon=${j.lng}#map=17/${j.lat}/${j.lng}">conferir no mapa</a> · depois clique em Salvar`; }
    catch(e){ toast(e.message); } bt.disabled=false; bt.textContent='Localizar no mapa'; };
  $('#save').onclick=async()=>{
    const horario={}; DIAS.forEach((_,i)=>{ const a=parseH($(`[data-ha="${i}"]`).value), b=parseH($(`[data-hb="${i}"]`).value); horario[i]=$(`[data-hd="${i}"]`).checked&&a!=null&&b!=null&&b>a?[a,b]:null; });
    const fx=$('#lfx').value.split('\n').map(l=>l.split(';')).filter(x=>x[0]&&x[0].trim()).map(([k,t])=>[+(k.replace(',','.').trim())||0,+(String(t||'0').replace(',','.').trim())||0]).filter(x=>x[0]>0);
    const entrega={modo:EMODO,faixas:fx,raioMax:+$('#lrm').value||0,fator:+$('#lft').value||1.3}, lat=parseFloat(String($('#llat').value).replace(',','.')), lng=parseFloat(String($('#llng').value).replace(',','.'));
    if(EMODO==='distancia'&&!(isFinite(lat)&&isFinite(lng))) return toast('Localize a loja no mapa para usar a taxa por distância');
    if(EMODO==='distancia'&&!fx.length) return toast('Coloque pelo menos uma faixa de distância');
    const bairros=$('#lb').value.split('\n').map(l=>l.split(';')).filter(x=>x[0]&&x[0].trim()).map(([b,t])=>[b.trim(),+(String(t||'0').replace(',','.').trim())||0]);
    const mensagens={}; $$('[data-msg]').forEach(t=>mensagens[t.dataset.msg]=t.value.trim());
    const settings={entrega,lojaLat:isFinite(lat)?lat:null,lojaLng:isFinite(lng)?lng:null,subtitulo:$('#lsub').value.trim(),cidade:$('#lci').value.trim(),logo:$('#llogo').value,endereco:$('#lend').value.trim(),telefone:$('#ltel').value.trim(),tempoPreparo:Math.max(0,+$('#ltp').value||0),tempoEntrega:Math.max(0,+$('#lte').value||0),mensagens,tema:{cor:$('#tc').value,destaque:$('#td').value,acento:$('#ta').value,fonte:$('#tf').value},
      whatsapp:$('#lw').value,atendente:$('#lat').value.trim(),enviarWhats:$('#lew').checked,horario,bairros,minimo:+$('#lm').value||0,retirada:$('#lr').checked,
      pagamentos:$('#lpg').value.split(',').map(x=>x.trim()).filter(Boolean),pixAntecipado:$('#lpa').checked,pixChave:$('#lpx').value.trim(),pixNome:$('#lpn').value.trim(),promoTemas:DIAS.map((_,i)=>$(`[data-pt="${i}"]`).value.trim()),
      curtidas:{meta:Math.max(0,+$('#cm').value|0),desconto:Math.max(0,+$('#cd').value||0),campeao:Math.max(0,+$('#cc').value||0)},robo:{nome:$('#rn').value.trim()||'Atendente',ativo:$('#ra').checked}};
    if(settings.enviarWhats&&settings.whatsapp.replace(/\D/g,'').length<12) return toast('Coloque o WhatsApp com 55 + DDD');
    if(!settings.pagamentos.length) return toast('Coloque pelo menos uma forma de pagamento');
    if(settings.pixAntecipado&&!settings.pixChave) return toast('Para o Pix antecipado, cadastre a chave Pix');
    try{ await api('/api/p/loja','PUT',{name:$('#ln').value.trim()||LOJA.name,settings}); toast('Loja salva'); loadLoja(); }catch(e){ toast(e.message); } };
}

/* ---------------- pixel ---------------- */
async function pixel(){
  await loadLoja(); const s=LOJA.settings; let capi=[]; try{ capi=(await api(`/api/p/report?de=${addDays(today(),-30)}&ate=${today()}`)).capi; }catch{}
  $('#main').innerHTML=`<div class="bar"><h1>Pixel Meta</h1><button class="btn" id="save">Salvar</button></div><div class="grid">
  <div class="card"><h2>Pixel</h2><div class="row"><label class="f">ID do Pixel (conjunto de dados)<input type="text" id="px" value="${esc(s.pixelId)}" inputmode="numeric" placeholder="Ex.: 123456789012345"><span class="h">No Gerenciador de Eventos da Meta, em Fontes de dados.</span></label>
    <p class="help">Com o ID preenchido, o cardápio envia sozinho, pelo navegador <b>e</b> pelo servidor (API de Conversões): <b>PageView</b> (abriu o cardápio), <b>ViewContent</b> (abriu produto), <b>AddToCart</b> (pôs na sacola), <b>InitiateCheckout</b> (abriu a sacola), <b>AddPaymentInfo</b> (escolheu a forma de pagamento), <b>Contact</b> (abriu o direct) e <b>Purchase</b> (pedido enviado, com valor, nº do pedido, itens e cupom). Cada evento vai com o mesmo ID nos dois caminhos, então a Meta não conta em dobro.</p></div></div>
  <div class="card"><h2>API de Conversões (recomendado)</h2><div class="row"><label class="f">Token de acesso<input type="password" id="ct" value="${esc(s.capiToken)}" autocomplete="off" placeholder="Gerado no Gerenciador de Eventos → Configurações"></label>
    <label class="f">Código de teste (opcional)<input type="text" id="cte" value="${esc(s.capiTeste)}" placeholder="TEST12345"><span class="h">Use só enquanto testa em "Testar eventos"; depois apague.</span></label>
    <p class="help">A compra também é enviada pelo servidor, com o mesmo ID do evento do Pixel. Assim a Meta não conta duas vezes e as vendas aparecem mesmo com bloqueador de anúncio.</p></div></div>
  <div class="card"><h2>Huntix CRM</h2><div class="row"><label class="f">Chave do CRM<input type="password" id="crm" value="${esc(s.crmToken||'')}" autocomplete="off" placeholder="hx_..."><span class="h">No Huntix CRM: Configurações → Huntix Cardápio → Gerar chave.</span></label>
    <p class="help">Com a chave salva, cada pedido vai sozinho para o CRM: o cliente entra no funil como venda fechada, o pedido aparece na aba Pedidos e o status (preparando, saiu, concluído) acompanha.</p></div></div>
  <div class="card"><h2>Últimos eventos enviados pelo servidor</h2>${capi.length?`<div class="tw"><table><tr><th>Quando</th><th>Resultado</th></tr>${capi.map(c=>`<tr><td>${new Date(c.created_at).toLocaleString('pt-BR')}</td><td>${esc(c.info)}</td></tr>`).join('')}</table></div>`:'<p class="muted">Nenhum envio ainda. Aparece aqui depois do primeiro pedido com o token preenchido.</p>'}</div></div>`;
  $('#save').onclick=async()=>{ try{ await api('/api/p/loja','PUT',{name:LOJA.name,settings:{pixelId:$('#px').value.trim(),capiToken:$('#ct').value.trim(),capiTeste:$('#cte').value.trim(),crmToken:$('#crm').value.trim()}}); toast('Salvo'); }catch(e){ toast(e.message); } };
}

/* ---------------- conta ---------------- */
async function conta(){
  $('#main').innerHTML=`<div class="bar"><h1>Conta</h1></div><div class="card" style="max-width:460px"><h2>Trocar senha</h2>
    ${ME.role==='admin'?'<p class="muted">Você está como administrador. As senhas dos clientes ficam no painel admin.</p>':`<div class="row"><div class="muted">${esc(ME.email)}</div><label class="f">Senha atual<input type="password" id="a1" autocomplete="current-password"></label><label class="f">Nova senha (8+ caracteres)<input type="password" id="a2" autocomplete="new-password"></label><div class="err" id="me"></div><div><button class="btn" id="ok">Trocar senha</button></div></div>`}</div>`;
  $('#ok')&&($('#ok').onclick=async()=>{ try{ await api('/api/p/senha','POST',{atual:$('#a1').value,nova:$('#a2').value}); toast('Senha trocada'); $('#a1').value=$('#a2').value=''; $('#me').textContent=''; }catch(e){ $('#me').textContent=e.message; } });
}
</script>
</body>
