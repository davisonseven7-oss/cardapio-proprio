<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Acompanhar pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Página que o cliente abre para acompanhar o pedido (link enviado no WhatsApp) */
:root{--bg:#fff;--soft:#F5F7F1;--ink:#121712;--muted:#6A7368;--line:#E6E9E1;--green:#17603A;--lime:#C9F25C;--sun:#FFC53D;--bad:#D92D3A;
  --f-brand:"Shrikhand",Georgia,serif;--f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0F0C;--soft:#161B16;--ink:#EEF2EA;--muted:#98A294;--line:#242B23;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0F0C;--soft:#161B16;--ink:#EEF2EA;--muted:#98A294;--line:#242B23;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui)}
.app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--line)}
.top b{font-family:var(--f-brand);font-weight:400;font-size:22px;color:var(--green);line-height:1.1}
.hero{margin-top:18px;border-radius:24px;padding:20px;background:var(--green);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--lime);opacity:.25}
.hero small{font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-size:11px}
.hero h1{font-family:var(--f-brand);font-weight:400;font-size:clamp(28px,8vw,38px);line-height:1.02;margin:6px 0 6px;position:relative;z-index:1}
.hero p{margin:0;opacity:.92;position:relative;z-index:1}
.hero.bad{background:var(--bad)}
.eta{display:inline-block;margin-top:12px;background:var(--sun);color:#1B1300;font-weight:800;padding:6px 12px;border-radius:99px;font-size:13px;position:relative;z-index:1}
.tl{margin:22px 4px 0;display:grid;gap:0}
.st{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;position:relative;padding-bottom:18px}
.st::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st i{width:28px;height:28px;border-radius:50%;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--muted);z-index:1}
.st.done i{background:var(--green);border-color:var(--green);color:#fff}
.st.done::before{background:var(--green)}
.st.now i{background:var(--sun);border-color:var(--sun);color:#1B1300;box-shadow:0 0 0 6px color-mix(in srgb,var(--sun) 30%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--sun) 10%,transparent)}}
.st b{display:block;font-size:15px}.st span{color:var(--muted);font-size:12px}
.st time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:4px}
.box{margin-top:6px;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.box h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-variant-numeric:tabular-nums}
.ln small{display:block;color:var(--muted)}
.tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.pix{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.pix span{font-weight:800;word-break:break-all}
.pix button{margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;background:var(--bg);color:var(--ink);cursor:pointer}
.btns{display:grid;gap:8px;margin-top:16px}
.btn{height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;background:var(--soft);color:var(--ink)}
.btn.wa{background:#1FA855;color:#fff}
.upd{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}
.full{min-height:80vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"><div class="full">Carregando pedido…</div></div>
<script>
const [SLUG,,TRACK]=location.pathname.split('/').filter(Boolean);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hh=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const FONTS={'Shrikhand':'Shrikhand','Archivo Black':'Archivo+Black','Rye':'Rye','Bebas Neue':'Bebas+Neue','Pacifico':'Pacifico','Lobster':'Lobster','Playfair Display':'Playfair+Display:wght@800','Fredoka':'Fredoka:wght@700'};
let last='', themed=false;
async function load(){
  let r; try{ r=await fetch(`/api/m/${SLUG}/pedido/${encodeURIComponent(TRACK)}`); }catch{ return; }
  if(!r.ok){ $('#app').innerHTML='<div class="full"><div><h2 style="color:var(--ink)">Pedido não encontrado</h2>Confira o link que você recebeu.</div></div>'; return; }
  const o=await r.json(), L=o.loja, T=L.tema||{};
  if(!themed){ themed=true; const rs=document.documentElement.style; if(T.cor) rs.setProperty('--green',T.cor); if(T.destaque) rs.setProperty('--sun',T.destaque); if(T.acento) rs.setProperty('--lime',T.acento);
    if(FONTS[T.fonte]){ $('#fonts').href=`https://fonts.googleapis.com/css2?family=${FONTS[T.fonte]}&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap`; rs.setProperty('--f-brand',`"${T.fonte}",Georgia,serif`); } }
  document.title=`Pedido #${o.num} · ${L.name}`;
  const key=o.status+'|'+o.log.length; if(key===last) return; last=key;
  const at=s=>{ const l=o.log.filter(x=>x.s===s).pop(); return l?l.t:null; };
  const pixFirst=/antecipado/i.test(o.payment);
  const steps=[pixFirst?['pix','Pagamento Pix',o.status==='pix'?'Aguardando a loja confirmar o seu Pix':'Pix confirmado pela loja']:['novo','Pedido recebido','A loja recebeu seu pedido'],['preparando','Em preparo',o.retirada?'Estamos separando tudo':'Estamos preparando com carinho'],
    ['saiu',o.retirada?'Pronto para retirada':'Saiu para entrega',o.retirada?'Pode vir buscar na loja':'O entregador está a caminho'],['concluido',o.retirada?'Retirado':'Entregue','Bom proveito!']];
  const idx=steps.findIndex(s=>s[0]===o.status);
  const head={pix:['Aguardando seu Pix','pague e envie o comprovante: a loja confirma e já começa o preparo.'],novo:['Recebemos seu pedido!','Aguardando a loja confirmar.'],preparando:['Seu pedido está em preparo','Já já fica pronto.'],
    saiu:o.retirada?['Pronto para retirada!','Pode vir buscar na loja.']:['Saiu para entrega!','Fique de olho no portão. 🛵'],concluido:[o.retirada?'Pedido retirado':'Pedido entregue','Obrigado pela preferência! 💚'],cancelado:['Pedido cancelado','Se tiver dúvida, fale com a loja.']}[o.status];
  let eta='';
  if(['pix','novo','preparando'].includes(o.status)||(o.status==='saiu'&&!o.retirada)){
    const base=new Date(at('preparando')||o.created_at), mins=(o.status==='saiu'?0:L.tempoPreparo)+(o.retirada?0:L.tempoEntrega), from=o.status==='saiu'?new Date(at('saiu')):base;
    const prev=new Date(from.getTime()+(o.status==='saiu'?L.tempoEntrega:mins)*6e4); eta=`Previsão: ${o.retirada?'pronto':'chega'} por volta de ${hh(prev.toISOString())}`;
  }
  const wa=L.whatsapp?`https://wa.me/${L.whatsapp}?text=${encodeURIComponent(`Oi! Sobre o meu pedido #${o.num}:`)}`:'';
  $('#app').innerHTML=`<div class="top">${L.logo?`<img src="${esc(L.logo)}" alt="">`:''}<b>${esc(L.name)}</b></div>
    <div class="hero ${o.status==='cancelado'?'bad':''}"><small>Pedido #${o.num}</small><h1>${head[0]}</h1><p>${o.customer?esc(o.customer)+', '+head[1].charAt(0).toLowerCase()+head[1].slice(1):head[1]}</p>${eta?`<span class="eta">${eta}</span>`:''}</div>
    ${o.status==='cancelado'?'':`<div class="tl">${steps.map((s,i)=>{ const t=at(s[0]); return `<div class="st ${i<idx||o.status==='concluido'?'done':i===idx?'now':''}"><i>${i<idx||o.status==='concluido'?'✓':i+1}</i><div><b>${s[1]}</b><span>${s[2]}</span></div><time>${t?hh(t):''}</time></div>`; }).join('')}</div>`}
    <div class="box"><h2>Seu pedido</h2>${o.items.map(i=>`<div class="ln"><span>${i.qty}× ${esc(i.nome)}${i.opts.length?`<small>${esc(i.opts.join(' · '))}</small>`:''}</span><span>${BRL(i.total)}</span></div>`).join('')}
      ${o.discount?`<div class="ln"><span>Desconto</span><span>− ${BRL(o.discount)}</span></div>`:''}<div class="ln"><span>${o.retirada?'Retirada':'Entrega'}</span><span>${o.fee?BRL(o.fee):'grátis'}</span></div>
      <div class="ln tot"><span>Total</span><span>${BRL(o.total)}</span></div><div class="ln"><small>${pixFirst?`Pagamento: Pix antecipado${o.status==='pix'?' (aguardando confirmação)':' ✓ confirmado'}`:`Pagamento na ${o.retirada?'retirada':'entrega'}: ${esc(o.payment)}`}</small></div>
      ${/pix/i.test(o.payment)&&L.pixChave&&(o.status==='pix'||(!pixFirst&&!['concluido','cancelado'].includes(o.status)))?`<div class="pix">${o.status==='pix'?`<b>Pague ${BRL(o.total)} no Pix</b>${L.whatsapp?` e <a href="https://wa.me/${L.whatsapp}?text=${encodeURIComponent(`Oi! Segue o comprovante do Pix do pedido #${o.num} (${BRL(o.total)}).`)}" target="_blank" rel="noopener">envie o comprovante</a>`:''}`:'<b>Quer adiantar o Pix?</b> (opcional)'}<br>Chave: <span>${esc(L.pixChave)}</span>${L.pixNome?` · ${esc(L.pixNome)}`:''}<br><button type="button" id="cpx">Copiar chave Pix</button></div>`:''}
      ${o.retirada?(L.endereco?`<div class="ln"><small>Retirar em: ${esc(L.endereco)}</small></div>`:''):`<div class="ln"><small>Entregar em: ${esc(o.address||'')}${o.bairro?', '+esc(o.bairro):''}</small></div>`}</div>
    <div class="btns">${wa?`<a class="btn wa" href="${wa}" target="_blank" rel="noopener">Falar com a loja no WhatsApp</a>`:''}<a class="btn" href="/${esc(L.slug)}">Voltar ao cardápio</a></div>
    <div class="upd">Esta página atualiza sozinha.</div>`;
  const cpx=$('#cpx'); if(cpx) cpx.onclick=()=>navigator.clipboard.writeText(L.pixChave).then(()=>cpx.textContent='Chave copiada ✓').catch(()=>{});
}
load(); setInterval(()=>{ if(document.visibilityState==='visible') load(); },15000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(); });
</script>
</body>
</html>
